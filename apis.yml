- aid: open-gateway:camara-sim-swap
  name: CAMARA SIM Swap API
  description: CAMARA SIM Swap 2.1.0 as certified under GSMA Open Gateway. Checks whether the SIM associated
    with a mobile phone number has been swapped within a given period, and retrieves the last SIM change
    date, so banks and fintechs can block account-takeover attacks. Per the GSMA Q1 2026 update this is
    the single most commercially launched Open Gateway API.
  humanURL: https://github.com/camaraproject/SimSwap
