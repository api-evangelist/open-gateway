  name: CAMARA Number Verification API
  description: CAMARA Number Verification 2.1.0 as certified under GSMA Open Gateway. Verifies that the
    phone number claimed by a user matches the number of the SIM on the network connection, or returns
    the network-asserted phone number, using OIDC over the mobile data connection. The most widely launched
    Open Gateway API alongside SIM Swap.
  humanURL: https://github.com/camaraproject/NumberVerification
