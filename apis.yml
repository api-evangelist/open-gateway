aid: open-gateway
url: https://raw.githubusercontent.com/api-evangelist/open-gateway/refs/heads/main/apis.yml
name: GSMA Open Gateway
kind: company
description: 'GSMA Open Gateway is the mobile industry''s operator-commitment and certification layer
  for network APIs, run by the GSM Association from its London headquarters in the United Kingdom. Launched
  at MWC Barcelona on 27 February 2023 with 21 operator groups and eight universal network APIs, it is
  the go-to-market wrapper around CAMARA, the Linux Foundation-hosted Telco Global API Alliance that actually
  authors the OpenAPI definitions. GSMA sits above the value chain rather than in it: it signs operators
  and channel partners to a memorandum of understanding, certifies implementations against CAMARA service
  APIs and TM Forum Operate APIs, and publishes which certified APIs are live in which markets. Its API
  posture is honestly non-existent as a first-party surface. GSMA operates no callable API, publishes
  no OpenAPI under its own name, and runs no self-serve developer portal with keys or a sandbox. open-gateway.gsma.com
  is a filterable directory of certified deployments, and every automated probe of it and of gsma.com
  returned an HTTP 403 Cloudflare bot challenge. The specifications are open on GitHub under camaraproject
  and tmforum-apis; the endpoints belong to operators; and developers reach them through aggregators and
  channel partners such as Aduna, Vonage, Infobip, Sinch, Twilio, Nokia, AWS and Bridge Alliance rather
  than through the GSMA. Per the GSMA''s own Q1 2026 Open Gateway update, 81 operator groups and 61 channel
  partners covering 292 networks and about 80 percent of global mobile connections have signed, with 237
  certified API assets drawn from 33 CAMARA tagged released APIs and 280 API instances commercially launched
  across 85 networks in 50 markets.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
