note: 'Entity graph derived from the CAMARA and TM Forum OpenAPI schemas carried in this repo. CAMARA
  APIs are deliberately small and non-relational: the recurring cross-API entity is the Device identifier
  (phoneNumber / networkAccessIdentifier / ipv4Address / ipv6Address), which is the join key across nearly
  every Open Gateway API. TMF931 is the one relational model, linking ApiProduct, ApiProductOrder, Application
  and ApplicationOwner.'
shared_identifiers:
- name: Device
  fields:
  - phoneNumber
  - networkAccessIdentifier
  - ipv4Address
  - ipv6Address
  note: The universal CAMARA subject identifier. With a 3-legged access token the device is implied by
    the token and MUST NOT be sent in the request body.
- name: PhoneNumber
  format: E.164 with leading +
  note: Primary identifier for SIM Swap, Number Verification, KYC, OTP SMS and Device Swap.
- name: SessionId
  note: Quality on Demand session resource identifier (UUID).
- name: SubscriptionId
  note: Event subscription resource identifier for CloudEvents subscriptions.
- name: PaymentId
  note: Carrier Billing payment resource identifier.
