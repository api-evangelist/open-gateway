deprecation:
  policy_url: https://github.com/camaraproject/ReleaseManagement/blob/main/documentation/API_Release_Guidelines.md
  design_guide: https://github.com/camaraproject/Commonalities/blob/main/documentation/CAMARA-API-Design-Guide.md
  sunset_header: false
  deprecation_header: false
  policy: >-
    The CAMARA API Design Guide asks providers to establish obsolescence of a superseded API version
    over a reasonable period — stated as six months — and to monitor usage of the old version before
    withdrawal. Backward-incompatible changes require a new MAJOR version; MINOR and PATCH versions
    must remain backward compatible. No RFC 8594 Sunset or Deprecation response headers are mandated,
    so deprecation is announced through the release process rather than in the HTTP response.
  window: 6 months (guidance, not contractual)
