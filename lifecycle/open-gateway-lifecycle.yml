note: >-
  Open Gateway has a two-layer lifecycle. CAMARA governs the specification lifecycle through
  twice-yearly meta-releases managed by the Release Management Working Group; GSMA governs the
  implementation lifecycle through its certification programme, run jointly with TM Forum since 2025.
  Neither layer operates a status page or an SLA, because GSMA runs no endpoints — availability and
  uptime belong to each certified operator and channel partner.
