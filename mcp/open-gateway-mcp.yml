first_party_note: The GSMA hosts no MCP server. The MCP surface for Open Gateway APIs is being defined
  inside CAMARA, the Linux Foundation project that authors the specifications GSMA certifies. In January
  2026 CAMARA published the white paper "Bridging AI Systems and Network Infrastructure through MCP",
  and in June 2026 the Commonalities Working Group opened MCPEnablement_PI1 to hold provider implementations.
  The server catalogued here is the Orange SA contribution to that repository. It is Apache-2.0 licensed,
  it is explicitly NOT a normative CAMARA MCP specification, and it is not hosted by anyone as a remote
  endpoint.
server:
  name: orange-network-api
  transport: stdio
  url: null
  url_note: No hosted or remote MCP endpoint is published. The server runs locally over stdio.
  command: node /absolute/path/to/project/dist/index.js
  package: '@zodiac/network-api-mcp'
  package_registry_status: not published to npm (404); build from source
  sdk: '@modelcontextprotocol/sdk ^1.29.0'
  runtime: Node.js >= 24
  license: Apache-2.0
  repository: https://github.com/camaraproject/MCPEnablement_PI1
  maintainer: Orange SA, contributed to the CAMARA Commonalities Working Group
authentication:
  type: oauth2-client-credentials
  env:
  - CLIENT_ID
  - CLIENT_SECRET
  provisioning: https://developer.orange.com/apis/camara-playground
  note: Credentials are Orange CAMARA Playground credentials, not GSMA credentials. The server calls a
    single operator playground; it is not multi-operator and does not route through GSMA Open Gateway.
specification_work:
  white_paper: https://camaraproject.org/wp-content/uploads/sites/12/2026/01/camara_wp_mcp_011226.pdf
