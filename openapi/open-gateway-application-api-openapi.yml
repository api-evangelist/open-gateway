  schemas:
    EntityRef:
      allOf:
      - $ref: '#/components/schemas/Extensible'
      - $ref: '#/components/schemas/Addressable'
      - type: object
        description: Entity reference schema to be use for all entityRef class.
        properties:
          id:
            type: string
            description: The identifier of the referred entity.
          href:
            type: string
            description: The URI of the referred entity.
          name:
            type: string
            description: Name of the referred entity.
          '@referredType':
            type: string
            description: The actual type of the target instance when needed for disambiguation.
        required:
        - id
    Application_MVO:
      allOf:
      - $ref: '#/components/schemas/LogicalResource_MVO'
      - type: object
        description: Application is a logical resource that can consume API products. It's a specialization of a LogicalResource in the Open Gateway context.
        properties:
          commercialName:
            type: string
            description: Exact name of the Application as marketed (and known by the end-user).
          logoUrl:
            type: string
            description: Url to retrieve the Application official logo.
          privacyPolicyURL:
            type: string
            description: Url to Application privacy policy, if applicable.
          redirectUrl:
            type: array
            items:
              type: string
            description: After a user successfully authorizes an application, the authorization server will redirect the user back to the application.
          jwksUri:
            type: string
            description: 'Uri pointing to a JSON Web Key (JWK) : data structure that represents a cryptographic key'
          category:
            $ref: '#/components/schemas/ApplicationCategoryType'
          approvalStatusReason:
            type: string
            description: The reason why the approval state changed. DEPRECATED in the PATCH (bug to be fixed on next major version).
          privacyRightsRequestContact:
            type: array
            items:
              $ref: '#/components/schemas/ContactMedium'
            description: Contact information for the exercise of data protection rights to which the End Users can address. Must be only EmailContactMedium or WebFormContactMedium for this context.
          digitalIdentity:
            $ref: '#/components/schemas/ApiDigitalIdentity_MVO'
    JsonPatchOperations:
      description: JSONPatch Operations document as defined by RFC 6902
      type: array
      items:
        $ref: '#/components/schemas/JsonPatch'
    Extensible:
      type: object
      description: Base Extensible schema for use in TMForum Open-APIs - When used for in a schema it means that the Entity described by the schema  MUST be extended with the @type
      properties:
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
      required:
      - '@type'
    LogicalResourceRole:
      type: object
      description: A logical Resource Role is a role given to a logical resource in a given context.
      properties:
        grantedPermissionSet:
          description: The PermissionSet is a set of Permissions granted to a user (party, party role, resource or resource role). The set may be granted explicitly by an authorized user or may be acquired implicitly due to the role that the user is playing.
          type: array
          items:
            $ref: '#/components/schemas/ApiPermissionSet'
    TimePeriod:
      type: object
      description: A period of time, either as a deadline (endDateTime only) a startDateTime only, or both
      properties:
        startDateTime:
          description: Start of the time period, using IETC-RFC-3339 format
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
        endDateTime:
          description: End of the time period, using IETC-RFC-3339 format
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
    JsonPatch:
      type: object
      description: A JSONPatch document as defined by RFC 6902
      required:
      - op
      - path
      properties:
        op:
          type: string
          description: The operation to be performed
          enum:
          - add
          - remove
          - replace
          - move
          - copy
          - test
        path:
          type: string
          description: A JSON-Pointer
        value:
          description: The value to be used within the operations.
        from:
          type: string
          description: A string containing a JSON Pointer value.
    ApiConsumerPermission:
      allOf:
      - $ref: '#/components/schemas/Extensible'
      - type: object
        description: An ApiConsumerPermission allows an Application to consume an API.
        properties:
          managedAssetGroup:
            $ref: '#/components/schemas/ApiListAssetGroup'
      discriminator:
        propertyName: '@type'
        mapping:
          ApiConsumerPermission: '#/components/schemas/ApiConsumerPermission'
    Entity:
      type: object
      description: Base entity schema for use in TMForum Open-APIs. Property.
      allOf:
      - $ref: '#/components/schemas/Extensible'
      - $ref: '#/components/schemas/Addressable'
    ApiListAssetGroup:
      allOf:
      - $ref: '#/components/schemas/AssetGroup'
      - type: object
        description: Defines a group of API assets to which access can be controlled
        properties:
          apiProduct:
            type: array
            items:
              $ref: '#/components/schemas/ProductRef'
            description: The list of products for which permissions are given.
    ExternalIdentifier:
      allOf:
      - $ref: '#/components/schemas/Extensible'
      - type: object
        description: An identification of an entity that is owned by or originates in a software system different from the current system, for example a ProductOrder handed off from a commerce platform into an order handling system. The structure identifies the system itself, the nature of the entity within the system (e.g. class name) and the unique ID of the entity within the system. It is anticipated that multiple external IDs can be held for a single entity, e.g. if the entity passed through multiple systems on the way to the current system. In this case the consumer is expected to sequence the IDs in the array in reverse order of provenance, i.e. most recent system first in the list.
        properties:
          owner:
            type: string
            description: Name of the external system that owns the entity.
            example: MagentoCommerce
          externalIdentifierType:
            type: string
            description: Type of the identification, typically would be the type of the entity within the external system
            example: ProductOrder
          id:
            type: string
            description: identification of the entity within the external system.
      discriminator:
        propertyName: '@type'
        mapping:
          ExternalIdentifier: '#/components/schemas/ExternalIdentifier'
    ContactMedium_FVO:
      allOf:
      - $ref: '#/components/schemas/Extensible'
      - type: object
        description: 'Indicates the contact medium that could be used to contact the party. This is an abstract base class, the actual value is in one of the strongly-typed subclasses : EmailContactMedium, FaxContactMedium, PhoneContactMedium, GeographicAddressContactMedium, SocialMediaContactMedium...'
        properties:
          id:
            type: string
            description: Identifier for this contact medium.
          preferred:
            type: boolean
            description: If true, indicates that is the preferred contact medium
          contactType:
            type: string
            description: Type of the contact medium to qualify it like pro email / personal email. This is not used to define the contact medium used.
          validFor:
            $ref: '#/components/schemas/TimePeriod'
      discriminator:
        propertyName: '@type'
        mapping:
          ContactMedium: '#/components/schemas/ContactMedium_FVO'
          EmailContactMedium: '#/components/schemas/EmailContactMedium'
          FaxContactMedium: '#/components/schemas/FaxContactMedium'
          GeographicAddressContactMedium: '#/components/schemas/GeographicAddressContactMedium'
          PhoneContactMedium: '#/components/schemas/PhoneContactMedium'
          SocialContactMedium: '#/components/schemas/SocialContactMedium'
          WebFormContactMedium: '#/components/schemas/WebFormContactMedium_FVO'
    ExternalIdentifier_FVO:
      allOf:
      - $ref: '#/components/schemas/Extensible'
      - type: object
        description: An identification of an entity that is owned by or originates in a software system different from the current system, for example a ProductOrder handed off from a commerce platform into an order handling system. The structure identifies the system itself, the nature of the entity within the system (e.g. class name) and the unique ID of the entity within the system. It is anticipated that multiple external IDs can be held for a single entity, e.g. if the entity passed through multiple systems on the way to the current system. In this case the consumer is expected to sequence the IDs in the array in reverse order of provenance, i.e. most recent system first in the list.
        properties:
          owner:
            type: string
            description: Name of the external system that owns the entity.
            example: MagentoCommerce
          externalIdentifierType:
            type: string
            description: Type of the identification, typically would be the type of the entity within the external system
            example: ProductOrder
          id:
            type: string
            description: identification of the entity within the external system.
        required:
        - id
      discriminator:
        propertyName: '@type'
        mapping:
          ExternalIdentifier: '#/components/schemas/ExternalIdentifier_FVO'
    Application_RES:
      type: object
      description: Response object for Application
      allOf:
      - $ref: '#/components/schemas/Application'
      required:
      - id
      - href
    Error:
      discriminator:
        propertyName: '@type'
        mapping:
          Error: '#/components/schemas/Error'
      allOf:
      - $ref: '#/components/schemas/Extensible'
      - type: object
        required:
        - code
        - reason
        properties:
          code:
            type: string
            description: Application relevant detail, defined in the API or a common list.
          reason:
            type: string
            description: Explanation of the reason for the error which can be shown to a client user.
          message:
            type: string
            description: More details and corrective actions related to the error which can be shown to a client user.
          status:
            type: string
            description: HTTP Error code extension
          referenceError:
            type: string
            description: URI of documentation describing the error.
      description: Used when an API throws an Error, typically with a HTTP error response-code (3xx, 4xx, 5xx)
    ApiDigitalIdentity_FVO:
      allOf:
      - $ref: '#/components/schemas/Extensible'
      - type: object
        description: ApiDigitalIdentity is a class that allow to describe a digital identity for an individual or a resource or a specific party role. One of these three MUST be provided. If an individual is provided, this identity will be for all her/his partyRole. To avoid confusion it is recommended in this case to not provide partyRoleIdentified. DEPRECATED in the POST and PATCH, this attribute can't be valued by the API consumer in this context.
        properties:
          clientId:
            type: string
            description: 'OAuth2 Client ID: A public identifier for apps. Even though it is public, it is best that it is not guessable by third parties, so many implementations use something like a 32-character hex string. DEPRECATED in the POST and the PATCH, this attribute can''t be valued by the API consumer in this context.'
          redirectUrl:
            type: array
