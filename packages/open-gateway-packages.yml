note: >-
  Neither the GSMA nor the CAMARA Project publishes a first-party client library for Open Gateway
  APIs. This is structural, not an oversight: GSMA is a trade association that certifies operator
  implementations, and CAMARA ships OpenAPI definitions rather than code. Client libraries for these
  APIs are published by the operators, aggregators and channel partners that actually host an apiRoot
  (Vonage, Infobip, Sinch, Twilio, Nokia, Aduna, Telefonica, Orange, Deutsche Telekom), and are
  catalogued in those providers' own repositories rather than here.
