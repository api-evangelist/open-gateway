verdict:
  status: built-stub
  reason: >-
    Identity plus a genuinely rich harvested specification set, but no first-party public API and no
    self-serve portal. GSMA Open Gateway is the certification and commitment layer for network APIs,
    not a provider of them. The 22 OpenAPI documents in openapi/ are the definitions GSMA certifies
    against, harvested from CAMARA and TM Forum, and none of them can be called without an operator
    or channel-partner contract that supplies the apiRoot and the OIDC issuer.
